<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>НУР</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen canvas scene, HUD overlay — clock top-left, status pill top-center, log left, command dock bottom-center */
:root{
  --deep:#031230; --blue:#0c4aa6; --line:#7cc8ff; --cyan:#3fd6ff; --gold:#f5d33a; --ember:#ff8a2a;
  --ink:#e6f3ff; --mute:#8fb3d9; --glass:rgba(4,22,56,.62); --edge:rgba(124,200,255,.28);
  --display:"Exo 2","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--deep);color:var(--ink);font-family:var(--display);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.hud{position:absolute;left:0;right:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.top{top:0;padding-block:14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.clock b{display:block;font:600 28px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock span{font:400 11px/1.6 var(--mono);color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.pill{display:flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--edge);border-radius:999px;background:var(--glass);font:500 11px var(--mono);letter-spacing:.14em;color:var(--gold)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:blink 1.6s infinite}
.pill.busy{color:var(--cyan)} .pill.busy i{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.brand{font:500 11px var(--mono);color:var(--mute);letter-spacing:.14em;text-align:right}
.brand b{display:block;color:var(--ink);font:700 15px var(--display);letter-spacing:.3em}
@keyframes blink{50%{opacity:.35}}
.log{top:84px;width:min(300px,34vw);display:flex;flex-direction:column;gap:8px;font:400 11px/1.5 var(--mono);color:var(--mute)}
.log div{opacity:.9;min-width:0;overflow-wrap:anywhere}
.log em{font-style:normal;color:var(--cyan);letter-spacing:.1em}
.log em.u{color:var(--gold)}
.dock{bottom:0;padding-block:10px 16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.dock>*{pointer-events:auto;width:100%;max-width:620px}
.subtitle{margin:0;min-height:2.8em;text-align:center;font:400 15px/1.45 var(--display);color:var(--ink);text-shadow:0 1px 12px rgba(0,0,0,.6);text-wrap:balance}
.subtitle:empty::before{content:"";}
#wave{height:34px;max-width:220px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:400 16px var(--display);color:var(--ink);background:var(--glass);border:1px solid var(--edge);border-radius:10px;padding:11px 14px;outline:none;backdrop-filter:blur(6px)}
input::placeholder{color:var(--mute)}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(63,214,255,.18)}
button{font:600 13px var(--display);letter-spacing:.04em;color:var(--deep);background:var(--gold);border:0;border-radius:10px;padding:0 16px;cursor:pointer}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mic{background:var(--glass);color:var(--gold);border:1px solid var(--edge);padding:0 12px;display:grid;place-items:center}
.mic.on{background:var(--gold);color:var(--deep);box-shadow:0 0 0 4px rgba(245,211,58,.25);animation:blink 1.4s infinite}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{background:var(--glass);color:var(--ink);border:1px solid var(--edge);padding:9px 14px;font-weight:500}
.row button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.card{position:absolute;pointer-events:auto;max-width:240px;padding:12px 14px;background:var(--glass);border:1px solid var(--edge);border-radius:12px;backdrop-filter:blur(8px);font-size:13px;line-height:1.45}
.card h3{margin:0 0 4px;font:600 15px var(--display);color:var(--gold)}
.card p{margin:0;color:var(--mute)}
.card small{display:block;margin-top:6px;font:400 10px var(--mono);letter-spacing:.1em;color:var(--cyan)}
@media (max-width:640px){
  .log{display:none}
  .clock b{font-size:22px}
  .brand{display:none}
  .subtitle{font-size:14px}
}
@media (prefers-reduced-motion:reduce){.pill i{animation:none}}
</style>
</head>
<body>

<div id="app">
  <canvas id="scene" aria-label="AI ёрдамчи анимацияси"></canvas>

  <header class="hud top">
    <div class="clock"><b id="time">--:--</b><span id="date"></span></div>
    <div class="pill" id="pill"><i></i><span id="status">ТАЙЁР</span></div>
    <div class="brand"><b>НУР</b>14 АГЕНТ · ОНЛАЙН</div>
  </header>

  <aside class="hud log" id="log" aria-live="polite"></aside>

  <div class="card" id="card" hidden>
    <h3 id="cardName"></h3><p id="cardRole"></p><small>ФАОЛ АГЕНТ · САВОЛ ЁЗИНГ</small>
  </div>

  <footer class="hud dock">
    <p class="subtitle" id="subtitle" aria-live="polite"></p>
    <canvas id="wave"></canvas>
    <form id="form" autocomplete="off">
      <button type="button" id="micBtn" class="mic" aria-label="Микрофон"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <input id="q" name="q" placeholder="Ёзинг ёки микрофонни босиб гапиринг…" aria-label="Савол">
      <button type="submit">Юбориш</button>
    </form>
    <div class="row">
      <button type="button" id="viewBtn">Одамсимон кўриниш</button>
      <button type="button" id="soundBtn" aria-pressed="true">Овоз: ёқиқ</button>
      <button type="button" id="langBtn">Тил: ўзбекча</button>
    </div>
  </footer>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('scene'),ctx=cv.getContext('2d');
const wv=$('wave'),wctx=wv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,cx=0,cy=0,orbR=60,phone=false;

/* ---------- agents ---------- */
const AG=[
 ['Стратег','Режалар, мақсадлар ва устуворликларни белгилайди',-95,1,1],
 ['Молия','Харажат, даромад ва ҳисоботларни кузатади',-45,1,0],
 ['Муҳаррир','Матнларни ёзади ва таҳрирлайди',-12,1.05,0],
 ['Хотира','Суҳбатлар ва муҳим фактларни эслаб қолади',14,.78,0],
 ['Дизайн','Визуал ғоялар ва макетлар тайёрлайди',38,.95,1],
 ['Муҳандислик','Дастурлар ва техник масалалар билан ишлайди',62,1,1],
 ['CRM','Мижозлар базасини юритади',80,.8,0],
 ['Ижтимоий тармоқ','Постлар ва контент режасини тузади',104,1,1],
 ['Операциялар','Кундалик жараёнларни назорат қилади',130,.95,1],
 ['Маркетинг','Реклама ва бренд стратегиясини тузади',154,.95,1],
 ['Сотув','Битимлар ва мижозлар билан мулоқот',174,.9,1],
 ['Штаб бошлиғи','Вазифаларни агентлар орасида тақсимлайди',198,.82,0],
 ['Тадқиқотчи','Маълумот излайди ва таҳлил қилади',224,1.05,0],
 ['Календарь','Учрашувлар ва муддатларни режалаштиради',-66,1.3,0],
].map(([name,role,ang,r,hot],i)=>({name,role,ang,r,hot,x:0,y:0,ox:0,oy:0,seed:i*1.7}));
let active=null;

/* streams */
const ST=Array.from({length:24},(_,i)=>({b:Math.random(),a:20+Math.random()*60,f:.002+Math.random()*.004,p:Math.random()*6.28,s:.2+Math.random()*.5,d:[Math.random(),Math.random()]}));
/* orb sphere */
const SPH=[];{const n=240,g=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-2*(i+.5)/n,r=Math.sqrt(1-y*y),t=g*i;SPH.push([Math.cos(t)*r,y,Math.sin(t)*r])}}

/* ---------- humanoid particles ---------- */
let P=[],fig={};
function bez(p0,p1,p2,p3,t){const u=1-t;return u*u*u*p0+3*u*u*t*p1+3*u*t*t*p2+t*t*t*p3}
function genTargets(n){
  const avail=H-(phone?200:190)-(phone?60:70);
  const S=Math.min(W*.86/400,avail/420);
  const hx=W/2, top=(phone?64:72)+Math.max(0,(avail-420*S)/2);
  const hy=top+130*S, rx=70*S, ry=92*S, nW=64*S, nT=top+205*S, nB=top+262*S, bot=top+412*S;
  fig={S,hx,hy,rx,ry,nB,bot,fx:hx,fy:hy+.12*ry};
  const out=[],R=Math.random,add=(x,y,c)=>out.push({x,y,c});
  const b={head:.24,face:.31,neck:.06,vein:.05,sh:.28,sp:.06};
  // head contours
  const rings=[1,.95,.9,.84,.77];
  for(let i=0;i<n*b.head;i++){const f=rings[Math.floor(Math.pow(R(),1.8)*rings.length)],a=R()*6.283;
    if(Math.sin(a)>.55&&f<.9)continue;add(hx+Math.cos(a)*rx*f,hy+Math.sin(a)*ry*f,0)}
  // face horizontal lines
  const rows=phone?16:22;
  for(let i=0;i<n*b.face;i++){const k=Math.floor(R()*rows),y=hy-.78*ry+k*(1.62*ry/rows),dy=(y-hy)/ry;if(Math.abs(dy)>=1)continue;
    const hw=rx*Math.sqrt(1-dy*dy)*.9,x=hx+(R()*2-1)*hw,yy=y+Math.sin((x-hx)/S*.06+k)*2.4*S;
    const ex=(x-fig.fx)/(rx*.78),ey=(yy-fig.fy)/(ry*.5),o=ex*ex+ey*ey<1;
    add(x,yy,o?1:(R()<.6?0:3))}
  // neck
  for(let i=0;i<n*b.neck;i++){const s=R()<.5?-1:1,f=R()<.6?1:.7,y=nT+R()*(nB-nT);add(hx+s*nW/2*f*(1+(y-nT)/(nB-nT)*.15),y,0)}
  // veins
  for(let i=0;i<n*b.vein;i++){const j=Math.floor(R()*5)-2,t=R(),y=nT+12*S+t*(nB-nT+30*S);add(hx+j*(3+t*12)*S+Math.sin(t*9+j)*2.5*S,y,1)}
  // shoulders
  for(let i=0;i<n*b.sh;i++){const k=Math.floor(Math.pow(R(),1.3)*9),s=R()<.5?-1:1,t=R();
    const x=bez(nW/2+k*3*S,72*S+k*4*S,150*S+k*5*S,192*S-k*3*S,t),y=bez(nB-10*S+k*2.2*S,nB+16*S+k*2*S,nB+36*S+k*4*S,bot,t);add(hx+s*x,y,k<2?0:(R()<.75?0:3))}
  // sparks above head
  for(let i=0;i<n*b.sp;i++){const a=-Math.PI*(.12+R()*.76),f=1.02+Math.pow(R(),2)*.45;add(hx+Math.cos(a)*rx*f+(R()-.5)*6*S,hy+Math.sin(a)*ry*f,2)}
  while(out.length<n){const a=R()*6.283;out.push({x:hx+Math.cos(a)*rx,y:hy+Math.sin(a)*ry,c:0})}
  return out.slice(0,n);
}
function buildParticles(){
  const n=phone?1700:3200,T=genTargets(n);
  P=T.map((t,i)=>({tx:t.x,ty:t.y,c:t.c,seed:Math.random()*100,x:t.x,y:t.y,dl:Math.random()*.9,
    c1x:(Math.random()-.3)*1,c1y:Math.random(),c2x:Math.random(),c2y:Math.random()}));
  P.sort((a,b)=>a.c-b.c);
}

/* ---------- layout ---------- */
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;phone=W<640;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  wv.width=wv.clientWidth*DPR;wv.height=wv.clientHeight*DPR;wctx.setTransform(DPR,0,0,DPR,0,0);
  cx=W/2;cy=phone?H*.40:H*.43;orbR=Math.max(42,Math.min(W,H)*(phone?.12:.1));
  const rx=phone?W*.30:Math.min(W*.33,H*.62),ry=phone?Math.min(H*.2,W*.5):H*.26;
  AG.forEach(a=>{const t=a.ang*Math.PI/180;let x=cx+Math.cos(t)*rx*a.r,y=cy+Math.sin(t)*ry*a.r;
    x=Math.max(14,Math.min(W-14,x));a.x=x;a.y=y;const L=Math.hypot(x-cx,y-cy)||1;a.ox=(x-cx)/L;a.oy=(y-cy)/L});
  buildParticles();
  if(mode==='human'){P.forEach(p=>{p.x=p.tx;p.y=p.ty});hp=9}
  placeCard();
}

/* ---------- state ---------- */
let mode='net',mix=0,hp=0,level=.12,speakUntil=0,thinking=false,t0=performance.now(),last=t0;
function setMode(m){
  if(m===mode)return;mode=m;
  if(m==='human'){hp=0;const em={x:fig.hx+40*fig.S,y:fig.bot-6*fig.S};
    P.forEach(p=>{p.sx=em.x+(Math.random()-.5)*14;p.sy=em.y+(Math.random()-.5)*10;p.x=p.sx;p.y=p.sy});
    $('card').hidden=true}
  $('viewBtn').textContent=m==='human'?'Агентлар тармоғи':'Одамсимон кўриниш';
}

/* ---------- drawing: network ---------- */
function drawNet(t,a){
  ctx.globalAlpha=a;
  const g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.75);
  g.addColorStop(0,'#0e56c0');g.addColorStop(.45,'#0a3d8f');g.addColorStop(1,'#031230');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // streams
  ctx.lineWidth=1;
  ST.forEach((s,i)=>{const by=H*(.12+s.b*.72);ctx.strokeStyle=`rgba(124,200,255,${.08+(i%3)*.04})`;ctx.beginPath();
    for(let x=0;x<=W;x+=14){const y=by+Math.sin(x*s.f+s.p+t*s.s*.4)*s.a+Math.sin(x*s.f*2.3+t*.3)*s.a*.25;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
    s.d.forEach((d,k)=>{const x=((d+t*.03*(k+1)*s.s)%1)*W,y=by+Math.sin(x*s.f+s.p+t*s.s*.4)*s.a+Math.sin(x*s.f*2.3+t*.3)*s.a*.25;
      ctx.fillStyle='rgba(160,225,255,.8)';ctx.fillRect(x-1,y-1,2,2)})});
  // spokes
  AG.forEach(ag=>{ctx.strokeStyle=ag===active?'rgba(245,211,58,.55)':'rgba(140,210,255,.22)';ctx.beginPath();ctx.moveTo(cx+ag.ox*orbR*1.08,cy+ag.oy*orbR*1.08);ctx.lineTo(ag.x,ag.y);ctx.stroke();
    const L=(phone?30:70)+ (ag.seed*13%50);ctx.strokeStyle='rgba(140,210,255,.18)';ctx.beginPath();ctx.moveTo(ag.x+ag.ox*10,ag.y+ag.oy*10);
    const ex=ag.x+ag.ox*L,ey=ag.y+ag.oy*L;ctx.lineTo(ex,ey);ctx.stroke();ctx.fillStyle='rgba(124,200,255,.7)';ctx.beginPath();ctx.arc(ex,ey,1.8,0,7);ctx.fill();
    // packet along spoke
    const k=((t*.35+ag.seed)%1),px=cx+(ag.x-cx)*k,py=cy+(ag.y-cy)*k;if(k>.2){ctx.fillStyle=ag.hot?'rgba(245,211,58,.9)':'rgba(63,214,255,.9)';ctx.fillRect(px-1.2,py-1.2,2.4,2.4)}});
  // orb
  const pulse=1+level*.08;
  const og=ctx.createRadialGradient(cx,cy,orbR*.2,cx,cy,orbR*2.2);og.addColorStop(0,'rgba(63,214,255,.25)');og.addColorStop(.5,'rgba(245,211,58,.10)');og.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=og;ctx.beginPath();ctx.arc(cx,cy,orbR*2.2,0,7);ctx.fill();
  const ry=t*.4,cr=Math.cos(ry),sr=Math.sin(ry);
  SPH.forEach(([x,y,z])=>{const X=x*cr-z*sr,Z=x*sr+z*cr,al=.25+.55*(Z+1)/2;ctx.fillStyle=`rgba(170,230,255,${al})`;ctx.fillRect(cx+X*orbR*.82*pulse-.8,cy+y*orbR*.82*pulse-.8,1.6,1.6)});
  ctx.save();ctx.shadowColor='#f5d33a';ctx.shadowBlur=22;ctx.strokeStyle='#f5d33a';ctx.lineWidth=Math.max(3,orbR*.07);
  ctx.beginPath();ctx.arc(cx,cy,orbR*pulse,0,7);ctx.stroke();ctx.restore();
  ctx.strokeStyle='rgba(245,211,58,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,orbR*1.16*pulse,t*.6,t*.6+4.4);ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,orbR*1.24,-t*.4,-t*.4+1.6);ctx.stroke();
  // nodes
  const fs=phone?10.5:13;ctx.font=`600 ${fs}px "Exo 2",system-ui,sans-serif`;ctx.textBaseline='middle';
  AG.forEach(ag=>{const on=ag===active,col=ag.hot?'#f5d33a':'#3fd6ff',r=(phone?5:7)*(on?1.35:1)+Math.sin(t*2+ag.seed)*.6;
    ctx.save();ctx.shadowColor=col;ctx.shadowBlur=on?18:10;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(ag.x,ag.y,r,0,7);ctx.stroke();ctx.restore();
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(ag.x,ag.y,r*.38,0,7);ctx.fill();
    let left=ag.x<cx-4;const tw=ctx.measureText(ag.name).width;if(!left&&ag.x+r+7+tw>W-6)left=true;if(left&&ag.x-r-7-tw<6)left=false;ctx.textAlign=left?'right':'left';ctx.fillStyle=on?'#f5d33a':'#e6f3ff';
    let lx=ag.x+(left?-1:1)*(r+7);ctx.fillText(ag.name,lx,ag.y)});
  ctx.globalAlpha=1;
}

/* ---------- drawing: humanoid ---------- */
const COL=['rgba(90,200,255,.85)','rgba(255,150,50,.95)','rgba(200,240,255,.9)','rgba(60,150,230,.45)'];
function drawHuman(t,dt,a){
  ctx.globalAlpha=a;
  ctx.fillStyle='#030a1c';ctx.fillRect(0,0,W,H);
  const {hx,hy,rx,ry,S,fx,fy,nB}=fig;
  if(mode==='human')hp+=dt;
  // ember glow
  const gl=.35+level*.9;
  let g=ctx.createRadialGradient(fx,fy,0,fx,fy,rx*1.05);g.addColorStop(0,`rgba(255,170,60,${.55*gl*Math.min(1,hp)})`);g.addColorStop(.5,`rgba(255,110,30,${.22*gl*Math.min(1,hp)})`);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(fx,fy,rx*1.05,0,7);ctx.fill();
  // speech rings
  if(level>.3){for(let i=0;i<3;i++){const k=((t*.6+i/3)%1);ctx.strokeStyle=`rgba(124,200,255,${.25*(1-k)})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(hx,hy,rx*(1.2+k*1.2),ry*(1.1+k*.9),0,0,7);ctx.stroke()}}
  ctx.globalCompositeOperation='lighter';
  let cur=-1;const sz=phone?1.4:1.6;
  for(const p of P){
    let x,y;
    if(mode==='human'){
      const k=Math.max(0,Math.min(1,(hp-p.dl)/1.5));
      if(k<1){const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
        const c1x=hx+(170+p.c1x*90)*S,c1y=fig.bot-(140+p.c1y*80)*S,c2x=hx+(40+p.c2x*160)*S,c2y=hy-(150+p.c2y*90)*S;
        x=bez(p.sx,c1x,c2x,p.tx,e);y=bez(p.sy,c1y,c2y,p.ty,e);if(hp<p.dl)continue}
      else{x=p.tx+Math.sin(t*1.2+p.seed)*.7;y=p.ty+Math.cos(t*1.1+p.seed)*.7;
        if(p.c===1)y+=Math.sin(t*9+p.tx*.05)*level*2.4*S}
      p.x=x;p.y=y;
    }else{p.y-=dt*40;p.x+=Math.sin(p.seed+t)*dt*30;x=p.x;y=p.y}
    if(p.c!==cur){cur=p.c;ctx.fillStyle=COL[cur]}
    ctx.fillRect(x-sz/2,y-sz/2,sz,sz);
  }
  // chest core
  const cyC=nB+42*S,cr=(10+level*8)*S;g=ctx.createRadialGradient(hx,cyC,0,hx,cyC,cr*3);g.addColorStop(0,'rgba(200,245,255,.9)');g.addColorStop(.3,'rgba(63,214,255,.45)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(hx,cyC,cr*3,0,7);ctx.fill();
  ctx.globalCompositeOperation='source-over';
  // side readout
  ctx.font='500 10px "IBM Plex Mono",monospace';ctx.fillStyle='rgba(63,214,255,.8)';ctx.textAlign='left';
  const rxp=Math.min(W-150,hx+rx*1.6);if(!phone)ctx.fillText(level>.3?'НУТҚ · ФАОЛ':thinking?'ЎЙЛАЯПТИ ···':'ТИНГЛАЯПТИ ···',rxp,hy+ry*.9);
  ctx.globalAlpha=1;
}

/* ---------- waveform ---------- */
function drawWave(t){const w=wv.clientWidth,h=wv.clientHeight,n=31;wctx.clearRect(0,0,w,h);
  for(let i=0;i<n;i++){const d=Math.abs(i-(n-1)/2)/((n-1)/2),amp=(1-d*.85)*(.15+level*(.55+.45*Math.sin(t*14+i*1.3)));
    const bh=Math.max(2,amp*h),x=i*(w/n)+1;wctx.fillStyle=i===(n-1)/2?'#f5d33a':(d<.35?'rgba(245,211,58,.85)':'rgba(124,200,255,.7)');wctx.fillRect(x,(h-bh)/2,Math.max(1.5,w/n-3),bh)}}

/* ---------- loop ---------- */
function frame(now){
  const t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
  const target=mode==='human'?1:0;mix+=(target-mix)*Math.min(1,dt*(mode==='human'?3:4));
  const speaking=now<speakUntil||isSpeaking();
  const goal=speaking?.55+.4*Math.abs(Math.sin(t*7.3)*Math.sin(t*3.1)):thinking?.28+.1*Math.sin(t*6):.12+.04*Math.sin(t*1.5);
  level+=(goal-level)*Math.min(1,dt*10);
  ctx.clearRect(0,0,W,H);
  if(mix<.995)drawNet(reduce?0:t,1);
  if(mix>.005)drawHuman(t,dt,mix);
  drawWave(t);
  requestAnimationFrame(frame);
}

/* ---------- HUD ---------- */
const MONTHS=['январ','феврал','март','апрел','май','июн','июл','август','сентябр','октябр','ноябр','декабр'];
const DAYS=['якшанба','душанба','сешанба','чоршанба','пайшанба','жума','шанба'];
function tick(){const d=new Date();$('time').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('date').textContent=`${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`}
tick();setInterval(tick,10000);
function setStatus(s,busy){$('status').textContent=s;$('pill').classList.toggle('busy',!!busy)}
const logs=[];
function log(who,text){logs.push([who,text]);if(logs.length>6)logs.shift();
  $('log').replaceChildren(...logs.map(([w,tx])=>{const d=document.createElement('div'),e=document.createElement('em');e.textContent=w==='u'?'СИЗ · ':'НУР · ';if(w==='u')e.className='u';d.append(e,document.createTextNode(tx));return d}))}

function placeCard(){const c=$('card');if(!active||mode==='human'){c.hidden=true;return}
  $('cardName').textContent=active.name;$('cardRole').textContent=active.role;c.hidden=false;
  const cw=c.offsetWidth,ch=c.offsetHeight;let x=active.x-cw/2,y=active.y+(active.y<cy?22:-ch-22);
  x=Math.max(16,Math.min(W-cw-16,x));y=Math.max(70,Math.min(H-ch-200,y));c.style.left=x+'px';c.style.top=y+'px'}
cv.addEventListener('pointerdown',e=>{if(mode!=='net')return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  let best=null,bd=phone?34:28;AG.forEach(a=>{const d=Math.hypot(a.x-x,a.y-y);if(d<bd){bd=d;best=a}});
  if(Math.hypot(x-cx,y-cy)<orbR&&!best){active=null;placeCard();say('Мен НУР. Барча агентлар менинг қўл остимда.');return}
  active=best===active?null:best;placeCard();if(active)setSub(`${active.name} агенти фаол. Унга савол ёзинг.`)});

/* ---------- settings ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let sound=store.get('nurSound','1')==='1';
let recLang=store.get('nurLang','uz-UZ');
let pin=store.get('nurPin','');
function setSub(s){$('subtitle').textContent=s}
function paintButtons(){
  $('soundBtn').setAttribute('aria-pressed',sound);$('soundBtn').textContent='Овоз: '+(sound?'ёқиқ':'ўчиқ');
  $('langBtn').textContent='Тил: '+(recLang.startsWith('uz')?'ўзбекча':'русча');
}
paintButtons();

/* ---------- voice out: server voice (ElevenLabs), browser voice as fallback ---------- */
const player=new Audio();player.setAttribute('playsinline','');player.preload='auto';
let serverVoice=true,unlocked=false,curURL=null;
function silentWav(){const sr=8000,n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlock(){if(unlocked)return;unlocked=true;
  try{player.src=silentWav();const p=player.play();if(p)p.catch(()=>{})}catch(e){}
  try{if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}}
document.addEventListener('pointerdown',unlock,{capture:true});
function browserSpeak(text){if(!('speechSynthesis'in window))return;
  try{if(speechSynthesis.speaking)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
    const v=speechSynthesis.getVoices().find(x=>/^uz/i.test(x.lang))||speechSynthesis.getVoices().find(x=>/^ru/i.test(x.lang));
    if(v){u.voice=v;u.lang=v.lang}else u.lang='ru-RU';u.pitch=.8;speechSynthesis.speak(u)}catch(e){}}
async function speak(text){
  if(!sound)return;
  if(serverVoice){
    try{const r=await fetch('/api/nur',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'tts',text,pin})});
      if(r.status===501){serverVoice=false}
      else if(r.ok){const blob=await r.blob();if(curURL)URL.revokeObjectURL(curURL);curURL=URL.createObjectURL(blob);
        player.src=curURL;await player.play();return}
      else{const j=await r.json().catch(()=>({}));console.warn('TTS',j.error);setStatus('ОВОЗ ХИЗМАТИ ИШЛАМАДИ',true)}
    }catch(e){console.warn(e)}
  }
  browserSpeak(text);
}
function isSpeaking(){return (!player.paused&&!player.ended&&player.currentTime>0&&curURL&&player.src===curURL)||('speechSynthesis'in window&&speechSynthesis.speaking)}
function say(text){setSub(text);log('a',text);setStatus('ГАПИРЯПТИ',true);
  speakUntil=performance.now()+Math.min(6000,800+text.length*45);speak(text);
  clearTimeout(say.t);say.t=setTimeout(function w(){if(isSpeaking()){say.t=setTimeout(w,400);return}setStatus('ТАЙЁР')},1200)}

/* ---------- brain: Gemini through /api/nur ---------- */
const history=[];
let needPin=false;
async function ask(q){
  if(needPin){pin=q;store.set('nurPin',pin);needPin=false;say('Код сақланди. Энди саволингизни қайта ёзинг.');return}
  log('u',q);
  if(/юз|одамсимон|humanoid|қиёфа|кўрсат|лицо|покажи/i.test(q)&&!/тармоқ/i.test(q)){setMode('human');say('Одамсимон кўриниш очиляпти.');return}
  if(/тармоқ|агент|орқага|network/i.test(q)){setMode('net');say('Агентлар тармоғига қайтдим.');return}
  thinking=true;setStatus('ЎЙЛАЯПМАН',true);setSub('···');
  const role=active?`Ҳозир фаол агент: «${active.name}» — ${active.role}. Шу агент номидан, унинг соҳасига мос жавоб бер.`:'Сен барча агентларни бошқарувчи бош ёрдамчисан.';
  const system=`Сен НУР — шахсий AI ёрдамчисан (Темир одамдаги Жарвисга ўхшаш). Фойдаланувчи ўзбекча ёки русча ёзиши мумкин, лекин сен доим ўзбек тилида, кирилл ёзувида жавоб берасан. Жавоб қисқа бўлсин: 1–3 гап, рўйхатсиз ва махсус белгиларсиз, чунки у овоз чиқариб ўқилади. ${role}`;
  const messages=history.slice(-10).concat([{role:'user',content:q}]);
  try{
    const r=await fetch('/api/nur',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'chat',system,messages,pin})});
    const j=await r.json().catch(()=>({}));thinking=false;
    if(r.status===401){needPin=true;say('Махфий кодни ёзинг ва «Юбориш»ни босинг.');return}
    if(r.status===429){say('Бепул лимит тугади. Бир оздан кейин қайта уриниб кўринг.');return}
    if(!r.ok){say('Хатолик: '+(j.error||('сервер '+r.status)));return}
    const ans=(j.text||'').trim()||'Кечирасиз, жавоб топа олмадим.';
    history.push({role:'user',content:q},{role:'assistant',content:ans});say(ans);
  }catch(e){thinking=false;say('Интернетга уланишда хатолик бўлди. Яна уриниб кўринг.')}
}

/* ---------- voice in: microphone ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false,heard='';
function micOn(on){listening=on;$('micBtn').classList.toggle('on',on)}
function startListen(){
  if(!SR){$('q').focus();setSub('Бу браузерда микрофон йўқ. Клавиатурадаги микрофон белгисини босиб гапиринг.');return}
  if(listening){rec&&rec.stop();return}
  try{if('speechSynthesis'in window)speechSynthesis.cancel();player.pause()}catch(e){}
  heard='';rec=new SR();rec.lang=recLang;rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;heard=t;$('q').value=t;setSub(t+' …')};
  rec.onerror=e=>{
    if(e.error==='language-not-supported'&&!recLang.startsWith('ru')){recLang='ru-RU';store.set('nurLang',recLang);paintButtons();setSub('Ўзбек тили бу телефонда танилмади, русчага ўтказдим. Микрофонни яна босинг.')}
    else if(e.error==='not-allowed'||e.error==='service-not-allowed')setSub('Микрофонга рухсат йўқ. Настройки → Safari → Микрофон бўлимида «Разрешить»ни танланг.');
    else if(e.error==='no-speech')setSub('Ҳеч нарса эшитмадим. Микрофонни босиб, яна гапириб кўринг.');
    else setSub('Микрофон хатоси: '+e.error)};
  rec.onend=()=>{micOn(false);setStatus('ТАЙЁР');const q=heard.trim();if(q){$('q').value='';ask(q)}};
  try{rec.start();micOn(true);setStatus('ТИНГЛАЯПМАН',true);setSub('Гапиринг, эшитяпман…')}catch(e){micOn(false);setSub('Микрофонни ёқиб бўлмади: '+e.message)}
}
$('micBtn').onclick=()=>{unlock();startListen()};
$('soundBtn').onclick=()=>{sound=!sound;store.set('nurSound',sound?'1':'0');paintButtons();if(!sound){player.pause();try{speechSynthesis.cancel()}catch(e){}}else say('Овоз ёқилди.')};
$('langBtn').onclick=()=>{recLang=recLang.startsWith('uz')?'ru-RU':'uz-UZ';store.set('nurLang',recLang);paintButtons();setSub(recLang.startsWith('uz')?'Микрофон энди ўзбекча тинглайди.':'Микрофон энди русча тинглайди. Жавоблар барибир ўзбекча бўлади.')};
$('form').addEventListener('submit',e=>{e.preventDefault();unlock();const q=$('q').value.trim();if(!q)return;$('q').value='';ask(q)});
$('viewBtn').onclick=()=>{unlock();if(mode==='net'){log('u','Юзингни кўрсат');setMode('human');say('Одамсимон кўриниш очиляпти.')}else{setMode('net');say('Агентлар тармоғига қайтдим.')}};


addEventListener('resize',()=>{clearTimeout(resize.t);resize.t=setTimeout(resize,120)});
resize();
log('a','Тизим ишга тушди. 14 агент онлайн.');
setSub('Салом! Мен НУР. Савол ёзинг, агентни босинг ёки «Одамсимон кўриниш» тугмасини босинг.');
requestAnimationFrame(frame);
})();
</script>
